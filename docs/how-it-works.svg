<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-label="How the idea engine works: a weekly experiment loop (pick, skeptic, 7-day customer test, ledger) fed by a generation lane that runs alongside it. Only customer behaviour recorded in the ledger decides an idea's fate." font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#FBFBF8"/>

  <!-- Title -->
  <text x="40" y="40" font-size="20" font-weight="700" fill="#1E293B">How the idea engine works</text>
  <text x="40" y="62" font-size="12.5" fill="#475569">A weekly experiment loop with real customers. Idea generation runs alongside it and feeds it.</text>

  <!-- ===== Top row: agreement, customers, choose ===== -->
  <rect x="40" y="90" width="420" height="70" rx="10" fill="#E8F0FE" stroke="#2F5FD0" stroke-width="1.5"/>
  <text x="60" y="118" font-size="13" font-weight="700" fill="#1E293B">Step 0 · Working agreement + profiles</text>
  <text x="60" y="137" font-size="11" fill="#475569">goals · runway · hours · who decides · non-competes</text>
  <text x="60" y="152" font-size="11" fill="#475569">no vote commits another founder's money or time</text>

  <rect x="530" y="90" width="190" height="70" rx="10" fill="#E6F5EA" stroke="#2E8540" stroke-width="1.5"/>
  <text x="625" y="120" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">Customers</text>
  <text x="625" y="139" font-size="11" fill="#475569" text-anchor="middle">cold + warm contacts</text>

  <rect x="1010" y="80" width="160" height="80" rx="10" fill="#E8F0FE" stroke="#2F5FD0" stroke-width="1.5"/>
  <text x="1090" y="106" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">Choose</text>
  <text x="1090" y="124" font-size="11" fill="#475569" text-anchor="middle">among survivors:</text>
  <text x="1090" y="139" font-size="11" fill="#475569" text-anchor="middle">talk it through against</text>
  <text x="1090" y="153" font-size="11" fill="#475569" text-anchor="middle">the agreement</text>

  <!-- agreement -> skeptic -->
  <line x1="375" y1="160" x2="375" y2="228" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="383" y="199" font-size="11" fill="#334155">goals, time, cash</text>

  <!-- test <-> customers -->
  <line x1="605" y1="160" x2="605" y2="228" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)"/>
  <text x="597" y="190" font-size="11" fill="#334155" text-anchor="end">offer, ask</text>
  <text x="597" y="204" font-size="11" fill="#334155" text-anchor="end">to commit</text>
  <line x1="645" y1="228" x2="645" y2="162" stroke="#2E8540" stroke-width="1.5" marker-start="url(#arrow)"/>
  <text x="653" y="190" font-size="11" fill="#2E8540">deposits, LOIs,</text>
  <text x="653" y="204" font-size="11" fill="#2E8540">replies, refusals</text>

  <!-- ===== Weekly loop row ===== -->
  <text x="40" y="220" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">WEEKLY LOOP · max 2 ideas under test</text>

  <rect x="40" y="230" width="170" height="100" rx="10" fill="#E8F0FE" stroke="#2F5FD0" stroke-width="1.5"/>
  <text x="125" y="258" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">Pick 1–2 ideas</text>
  <text x="125" y="276" font-size="11" fill="#475569" text-anchor="middle">you three</text>
  <text x="125" y="300" font-size="11" fill="#475569" text-anchor="middle">week 1: an idea</text>
  <text x="125" y="314" font-size="11" fill="#475569" text-anchor="middle">you already have</text>

  <rect x="290" y="230" width="170" height="100" rx="10" fill="#F1EAFD" stroke="#7A45D8" stroke-width="1.5"/>
  <text x="375" y="258" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">Skeptic</text>
  <text x="375" y="276" font-size="11" fill="#475569" text-anchor="middle">AI · other vendor</text>
  <text x="375" y="300" font-size="11" fill="#475569" text-anchor="middle">riskiest assumption;</text>
  <text x="375" y="314" font-size="11" fill="#475569" text-anchor="middle">"unknown" allowed</text>

  <rect x="540" y="230" width="170" height="100" rx="10" fill="#E8F0FE" stroke="#2F5FD0" stroke-width="1.5"/>
  <text x="625" y="258" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">7-day test</text>
  <text x="625" y="276" font-size="11" fill="#475569" text-anchor="middle">you three</text>
  <text x="625" y="300" font-size="11" fill="#475569" text-anchor="middle">evidence must</text>
  <text x="625" y="314" font-size="11" fill="#475569" text-anchor="middle">match the claim</text>

  <rect x="790" y="230" width="170" height="100" rx="10" fill="#E8F0FE" stroke="#2F5FD0" stroke-width="1.5"/>
  <text x="875" y="258" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">Ledger + decide</text>
  <text x="875" y="276" font-size="11" fill="#475569" text-anchor="middle">you three · append-only</text>
  <text x="875" y="300" font-size="11" fill="#475569" text-anchor="middle">cold/warm · refusals</text>
  <text x="875" y="314" font-size="11" fill="#475569" text-anchor="middle">"was it a real test?"</text>

  <!-- loop arrows -->
  <line x1="210" y1="280" x2="288" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="272" font-size="11" fill="#334155" text-anchor="middle">idea card</text>
  <line x1="460" y1="280" x2="538" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="259" font-size="11" fill="#334155" text-anchor="middle">one test,</text>
  <text x="500" y="272" font-size="11" fill="#334155" text-anchor="middle">threshold</text>
  <line x1="710" y1="280" x2="788" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="750" y="272" font-size="11" fill="#334155" text-anchor="middle">results</text>

  <!-- outcomes -->
  <rect x="1010" y="232" width="160" height="30" rx="15" fill="#FFFFFF" stroke="#2E8540" stroke-width="1.5"/>
  <text x="1090" y="251" font-size="11.5" font-weight="600" fill="#2E8540" text-anchor="middle">survives</text>
  <rect x="1010" y="298" width="160" height="30" rx="15" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5"/>
  <text x="1090" y="317" font-size="11.5" font-weight="600" fill="#B42318" text-anchor="middle">kill → archive</text>
  <line x1="960" y1="262" x2="1008" y2="248" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="960" y1="298" x2="1008" y2="312" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1090" y1="232" x2="1090" y2="162" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- return path: next week -->
  <polyline points="875,330 875,372 160,372 160,332" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="517" y="366" font-size="11" fill="#334155" text-anchor="middle">continue · retest · "not yet tested"  →  next week</text>

  <!-- ===== Generation lane ===== -->
  <rect x="20" y="428" width="1160" height="272" rx="14" fill="#F3F4F7" stroke="#D5DAE1" stroke-width="1"/>
  <text x="40" y="452" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">GENERATION · runs alongside from week 1 · pauses while 2 ideas are already under test</text>

  <!-- profiles -> seed 1 -->
  <polyline points="40,140 26,140 26,495 38,495" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text transform="translate(18,330) rotate(-90)" font-size="11" fill="#334155" text-anchor="middle">profiles</text>

  <!-- seeds -->
  <rect x="40" y="470" width="240" height="50" rx="9" fill="#F1EAFD" stroke="#7A45D8" stroke-width="1.5"/>
  <text x="56" y="491" font-size="12" font-weight="700" fill="#1E293B">AI, from your profiles</text>
  <text x="56" y="508" font-size="11" fill="#475569">generated before seeing your ideas</text>

  <rect x="40" y="540" width="240" height="50" rx="9" fill="#F1EAFD" stroke="#7A45D8" stroke-width="1.5"/>
  <text x="56" y="561" font-size="12" font-weight="700" fill="#1E293B">AI, web research on real pain</text>
  <text x="56" y="578" font-size="11" fill="#475569">verbatim quote + URL for each</text>

  <rect x="40" y="610" width="240" height="50" rx="9" fill="#E8F0FE" stroke="#2F5FD0" stroke-width="1.5"/>
  <text x="56" y="631" font-size="12" font-weight="700" fill="#1E293B">Your ideas + remixes</text>
  <text x="56" y="648" font-size="11" fill="#475569">other customers, models, channels</text>

  <line x1="280" y1="495" x2="338" y2="556" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="565" x2="338" y2="570" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="635" x2="338" y2="584" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- merge -->
  <rect x="340" y="530" width="200" height="80" rx="10" fill="#F1EAFD" stroke="#7A45D8" stroke-width="1.5"/>
  <text x="440" y="556" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">Merge duplicates</text>
  <text x="440" y="575" font-size="11" fill="#475569" text-anchor="middle">→ plain 8-line cards</text>
  <text x="440" y="592" font-size="11" fill="#475569" text-anchor="middle">"unknown" · "hypothesis"</text>

  <!-- judgments -->
  <rect x="610" y="470" width="230" height="70" rx="10" fill="#E8F0FE" stroke="#2F5FD0" stroke-width="1.5"/>
  <text x="725" y="494" font-size="12.5" font-weight="700" fill="#1E293B" text-anchor="middle">① You three, privately</text>
  <text x="725" y="512" font-size="11" fill="#475569" text-anchor="middle">keep · drop · can't tell</text>
  <text x="725" y="528" font-size="11" fill="#475569" text-anchor="middle">recorded first</text>

  <rect x="610" y="600" width="230" height="70" rx="10" fill="#F1EAFD" stroke="#7A45D8" stroke-width="1.5"/>
  <text x="725" y="624" font-size="12.5" font-weight="700" fill="#1E293B" text-anchor="middle">② AI, other vendor</text>
  <text x="725" y="642" font-size="11" fill="#475569" text-anchor="middle">keep · drop · insufficient evidence</text>
  <text x="725" y="658" font-size="11" fill="#475569" text-anchor="middle">revealed after yours</text>

  <line x1="540" y1="558" x2="608" y2="508" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="584" x2="608" y2="632" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="523" font-size="11" fill="#334155">cards</text>
  <text x="560" y="632" font-size="11" fill="#334155">cards</text>

  <!-- compare -->
  <rect x="910" y="540" width="260" height="70" rx="10" fill="#E8F0FE" stroke="#2F5FD0" stroke-width="1.5"/>
  <text x="1040" y="566" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">Compare disagreements</text>
  <text x="1040" y="585" font-size="11" fill="#475569" text-anchor="middle">discuss where you differ,</text>
  <text x="1040" y="600" font-size="11" fill="#475569" text-anchor="middle">then agree a shortlist</text>

  <line x1="840" y1="508" x2="908" y2="560" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="840" y1="632" x2="908" y2="590" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="872" y="522" font-size="11" fill="#334155" text-anchor="middle">picks</text>
  <text x="872" y="626" font-size="11" fill="#334155" text-anchor="middle">picks</text>

  <!-- shortlist path into pick -->
  <polyline points="1040,540 1040,408 90,408 90,332" fill="none" stroke="#7A45D8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="565" y="402" font-size="11" fill="#5B2DB0" text-anchor="middle">shortlist of 10 or fewer · your own ideas always included</text>

  <!-- ===== Legend ===== -->
  <rect x="40" y="726" width="16" height="16" rx="4" fill="#E8F0FE" stroke="#2F5FD0" stroke-width="1.5"/>
  <text x="64" y="739" font-size="12" fill="#334155">You three</text>
  <rect x="150" y="726" width="16" height="16" rx="4" fill="#F1EAFD" stroke="#7A45D8" stroke-width="1.5"/>
  <text x="174" y="739" font-size="12" fill="#334155">AI (generator and critic from different vendors)</text>
  <rect x="470" y="726" width="16" height="16" rx="4" fill="#E6F5EA" stroke="#2E8540" stroke-width="1.5"/>
  <text x="494" y="739" font-size="12" fill="#334155">Real world</text>
  <text x="1170" y="739" font-size="12" font-style="italic" fill="#475569" text-anchor="end">No step scores ideas. Only customer behaviour in the ledger decides.</text>
</svg>
